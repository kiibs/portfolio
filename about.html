<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About — Emma Agatiello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">Emma Agatiello</a>
        <nav class="nav-links">
          <a href="index.html" class="nav-link" data-i18n="nav_work"
            >Trabajos</a
          >
          <a href="about.html" class="nav-link active" data-i18n="nav_about"
            >Sobre mí</a
          >
          <a href="contact.html" class="nav-link" data-i18n="nav_contact"
            >Contacto</a
          >
          <div class="lang-switch">
            <button class="lang-btn active" data-lang="es">ES</button>
            <span>/</span>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="about-grid">
        <div>
          <img
            src="assets/images/about-portrait.jpg"
            alt="Emma Agatiello Portrait"
            class="about-portrait"
          />
        </div>

        <div class="about-content">
          <h1 class="about-intro" data-i18n="about_intro">
            Hola, soy Emma Agatiello. Diseñadora gráfica graduada con enfoque en
            dirección de arte, branding y publicaciones editoriales.
          </h1>

          <!-- LOGOS DE HERRAMIENTAS SVG -->
          <div class="about-tools-section">
            <span class="meta-label" data-i18n="tools_label"
              >Herramientas & Software</span
            >

            <div class="tools-grid">
              <div class="tool-card">
                <svg viewBox="0 0 24 24">
                  <path d="M12 2L2 19.5h20L12 2zm0 4l6.5 11.5h-13L12 6z" />
                </svg>
                <span class="tool-name">Illustrator</span>
              </div>
              <div class="tool-card">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M4 3h16v18H4V3zm3 4v10h2V7H7zm5 0v10h5v-2h-3V7h-2z"
                  />
                </svg>
                <span class="tool-name">InDesign</span>
              </div>
              <div class="tool-card">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M3 3h18v18H3V3zm4 4v10h3v-4h2a3 3 0 0 0 0-6H7zm3 2h2a1 1 0 0 1 0 2h-2V9zm7 2a2.5 2.5 0 0 0-2.5 2.5V17h2v-3.5a.5.5 0 0 1 1 0V17h2v-3.5A2.5 2.5 0 0 0 17 11z"
                  />
                </svg>
                <span class="tool-name">Photoshop</span>
              </div>
              <div class="tool-card">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M12 12a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm0 0a3 3 0 1 1-3 3 3 3 0 0 1 3-3zm0 6a3 3 0 1 1-3 3 3 3 0 0 1 3-3zM6 6a3 3 0 0 1 3-3h3v6H9a3 3 0 0 1-3-3zm12 0a3 3 0 0 1-3 3h-3V3h3a3 3 0 0 1 3 3z"
                  />
                </svg>
                <span class="tool-name">Figma</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© 2026 Emma Agatiello</span>
        <span data-i18n="footer_location">Madrid / Remoto</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
